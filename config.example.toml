# Copy to ~/.config/coldsnake/config.toml and adjust. Do NOT commit a filled-in
# copy: it contains your mirrors and possibly your password.

# Prefer the ICEDRIVE_EMAIL / ICEDRIVE_PASSWORD environment variables, or a
# 0600 credentials file, over putting the password here.
[auth]
email = "you@example.com"
# password = ""
# Set twofa = true when the account has two-factor auth enabled; the confirm
# code is read from the ICEDRIVE_2FA_CODE env var (or a prompt on a tty).
# twofa = false

# One [[mirror]] block per local directory you want mirrored.
[[mirror]]
local = "/srv/data/Sync"
remote = "Sync"

[[mirror]]
local = "/srv/data/Pictures"
remote = "Pictures"

# Optional: skip files/dirs matching these globs (same as --exclude, repeatable
# globs in a list). Matched against the relative path and the file name.
exclude = ["*.tmp", ".stfolder/*", ".stversions/*"]
