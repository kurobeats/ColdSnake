[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coldsnake"
version = "0.1.0"
description = "Icedrive client: proof-of-work login, mirroring, folder listing, download, trash/restore, version history (no WebDAV, no dependencies)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
keywords = ["icedrive", "backup", "mirror", "cloud-storage"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = []

[project.scripts]
coldsnake = "coldsnake.cli:main"

[project.urls]
Homepage = "https://github.com/kurobeats/ColdSnake"
Issues = "https://github.com/kurobeats/ColdSnake/issues"
Source = "https://github.com/kurobeats/ColdSnake"

[tool.setuptools.packages.find]
where = ["src"]
